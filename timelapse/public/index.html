<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thorley Park Timelapse</title>

<!-- iPhone home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timelapse">
<meta name="theme-color" content="#1a3a0a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }

  :root {
    --green: #1a3a0a;
    --green-mid: #2d5016;
    --green-light: #3d6b1e;
    --cream: #f5f0e8;
    --bg: #faf8f4;
    --gold: #b8960c;
    --text: #1a1a1a;
    --text-mid: #6b6b6b;
    --card: #ffffff;
    --line: #e6e2da;
    --input-bg: #ffffff;
    --red: #c8102e;
    --amber: #b45309;
    --blue: #1e40af;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }

  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    line-height: 1.4;
  }
  a { color: var(--green-light); }

  .header {
    background: var(--green);
    color: var(--cream);
    text-align: center;
    padding: 2rem 1.5rem 1.2rem;
  }
  .header h1 {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 1.6rem;
    font-weight: 400;
    letter-spacing: 0.05em;
  }
  .header h1 a { color: inherit; text-decoration: none; }
  .header .subtitle {
    font-size: 0.8rem;
    opacity: 0.6;
    margin-top: 0.3rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .nav {
    display: flex;
    justify-content: center;
    gap: 0.25rem;
    background: var(--green-mid);
    padding: 0.4rem 0.5rem;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .nav a {
    color: var(--cream);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.45rem 0.9rem;
    border-radius: 999px;
    opacity: 0.75;
  }
  .nav a.active { background: rgba(255,255,255,0.14); opacity: 1; }

  .container { max-width: 720px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

  .section-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-mid);
    margin: 1.5rem 0 0.6rem 0.25rem;
  }
  .section-label:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--text-mid); font-size: 0.8rem; }
  .small { font-size: 0.8rem; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.75rem; }
  .mt { margin-top: 0.75rem; }
  .mb { margin-bottom: 0.75rem; }

  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 1rem;
    box-shadow: var(--shadow);
    margin-bottom: 0.6rem;
  }
  .card.link { cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform 0.15s ease; }
  .card.link:active { transform: scale(0.985); }
  .card-title { font-weight: 600; font-size: 1rem; }
  .card h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.5rem; }

  .pill {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    background: #e5e5e5;
    color: #444;
    white-space: nowrap;
  }
  .pill.capturing { background: #dcefd4; color: var(--green-mid); }
  .pill.finishing { background: #f7ecc0; color: #7a5f00; }
  .pill.completed { background: var(--green); color: var(--cream); }
  .pill.errored, .pill.failed { background: #f8d7dc; color: var(--red); }
  .pill.scheduled, .pill.queued { background: #e0e7ff; color: var(--blue); }
  .pill.running { background: #f7ecc0; color: #7a5f00; }
  .pill.done { background: #dcefd4; color: var(--green-mid); }
  .pill.paused { background: #fde7cf; color: var(--amber); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; margin-top: 0.6rem; }
  .stat { background: var(--bg); border-radius: 10px; padding: 0.5rem 0.65rem; }
  .stat .v { font-weight: 600; font-size: 0.95rem; }
  .stat .k { font-size: 0.68rem; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.06em; }

  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.5rem 0.9rem;
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    line-height: 1.2;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: var(--green); color: var(--cream); border-color: var(--green); }
  .btn-danger { color: var(--red); border-color: #f0c0c8; }
  .btn-sm { padding: 0.35rem 0.65rem; font-size: 0.78rem; }
  .btn-block { width: 100%; justify-content: center; }

  .field { margin-bottom: 0.85rem; }
  .field label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-mid); margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .field input[type=text], .field input[type=number], .field input[type=datetime-local], .field input[type=time], .field input[type=url], .field input[type=tel], .field select, .field textarea {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--input-bg);
    color: var(--text);
  }
  .field .hint { font-size: 0.75rem; color: var(--text-mid); margin-top: 0.3rem; }
  .inline { display: flex; gap: 0.5rem; align-items: center; }
  .inline > * { flex: 1 1 0; min-width: 0; }
  .inline > .fixed { flex: 0 0 auto; width: auto; }
  .inline input, .inline select { min-width: 0; }
  .check { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0; font-size: 0.9rem; }
  .check input { width: 20px; height: 20px; }
  .radios { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .radios label { border: 1px solid var(--line); border-radius: 999px; padding: 0.35rem 0.8rem; font-size: 0.85rem; cursor: pointer; }
  .radios input { display: none; }
  .radios input:checked + span { font-weight: 700; color: var(--green-mid); }
  .radios label:has(input:checked) { border-color: var(--green-light); background: #eef5e8; }

  .banner { border-radius: 12px; padding: 0.7rem 0.9rem; font-size: 0.85rem; margin-bottom: 0.6rem; }
  .banner.warn { background: #fde7cf; color: #7a3d00; }
  .banner.error { background: #f8d7dc; color: var(--red); }
  .banner.info { background: #e0e7ff; color: var(--blue); }
  .banner code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .estimate { background: #eef5e8; border-radius: 12px; padding: 0.7rem 0.9rem; font-size: 0.85rem; color: var(--green-mid); }

  .progress { height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; margin-top: 0.4rem; }
  .progress > div { height: 100%; background: var(--green-light); transition: width 0.4s ease; }

  .latest { width: 100%; border-radius: 10px; background: #111; aspect-ratio: 16 / 9; object-fit: contain; display: block; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 0.35rem; }
  .thumbs a { display: block; aspect-ratio: 16 / 9; background: #ddd; border-radius: 6px; overflow: hidden; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  video { width: 100%; border-radius: 10px; background: #000; margin-top: 0.5rem; }

  .loglines { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.7rem; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; background: var(--bg); border-radius: 10px; padding: 0.6rem; }
  .loglines .gap { color: var(--amber); }
  .loglines .err { color: var(--red); }
  .loglines .state { color: var(--blue); }

  details summary { cursor: pointer; font-weight: 600; font-size: 0.85rem; }
  .test-img { width: 100%; border-radius: 10px; margin-top: 0.5rem; background: #111; }

  .toast {
    position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%);
    background: #222; color: #fff; padding: 0.6rem 1rem; border-radius: 999px;
    font-size: 0.85rem; z-index: 100; max-width: 90vw; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--red); }

  .footer { text-align: center; padding: 2rem 1rem; font-size: 0.7rem; color: var(--text-mid); opacity: 0.5; }
  .empty { text-align: center; color: var(--text-mid); padding: 2rem 1rem; font-size: 0.9rem; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111;
      --text: #e8e8e8;
      --text-mid: #888;
      --card: #1a1a1a;
      --line: #333;
      --input-bg: #222;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
    .pill { background: #333; color: #ccc; }
    .pill.capturing, .pill.done { background: #1f3a14; color: #9fd48a; }
    .pill.finishing, .pill.running { background: #3a2f0a; color: #f0d070; }
    .pill.errored, .pill.failed { background: #3d1218; color: #ff8a9a; }
    .pill.scheduled, .pill.queued { background: #1a2350; color: #9fb0ff; }
    .pill.paused { background: #3d2510; color: #ffb070; }
    .banner.warn { background: #3d2510; color: #ffb070; }
    .banner.error { background: #3d1218; color: #ff8a9a; }
    .banner.info { background: #1a2350; color: #9fb0ff; }
    .estimate { background: #1f3a14; color: #9fd48a; }
    .radios label:has(input:checked) { background: #1f3a14; }
    .thumbs a { background: #333; }
  }
</style>
</head>
<body>

<div class="header">
  <h1><a href="#/">⛲ Thorley Park</a></h1>
  <div class="subtitle">Timelapse</div>
</div>

<nav class="nav" id="nav">
  <a href="#/" data-nav="jobs">Jobs</a>
  <a href="#/cameras" data-nav="cameras">Cameras</a>
  <a href="#/settings" data-nav="settings">Settings</a>
</nav>

<div class="container" id="view"><div class="empty">Loading…</div></div>

<div class="footer">Thorley Park · Timelapse · MacBook Pro</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
